<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Pregg — UI Kit</title>
<link rel="icon" href="../../assets/favicon.svg" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>
  html, body { margin: 0; background: #1e1e24; }
  #phone-shell { max-width: 420px; margin: 0 auto; min-height: 100svh; background: var(--bg-app); position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.3); }
</style>
</head>
<body>
<div id="phone-shell"><div id="root"></div></div>

<script type="text/babel" src="auth-screen.jsx"></script>
<script type="text/babel" src="dashboard-screen.jsx"></script>
<script type="text/babel" src="reminders-screen.jsx"></script>
<script type="text/babel" src="blood-pressure-screen.jsx"></script>
<script type="text/babel" src="weight-screen.jsx"></script>
<script type="text/babel" src="baby-screen.jsx"></script>
<script type="text/babel" src="settings-screen.jsx"></script>

<script type="text/babel">
const { NavBar } = window.PreggDesignSystem_bd552d;

function Icon(path) {
  return <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d={path} /></svg>;
}
const TABS = [
  { id: 'dashboard', label: 'Home', icon: Icon('M3 9l9-7 9 7v11a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z') },
  { id: 'reminders', label: 'Reminders', icon: Icon('M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11') },
  { id: 'bp', label: 'BP', icon: Icon('M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z') },
  { id: 'weight', label: 'Weight', icon: Icon('M12 3v2M5 21h14M7 21l1.5-9h7L17 21') },
  { id: 'baby', label: 'Baby', icon: Icon('M12 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z') },
  { id: 'settings', label: 'Settings', icon: Icon('M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z') },
];

function App() {
  const [signedIn, setSignedIn] = React.useState(false);
  const [state, setState] = React.useState(window.PreggKit.initialState);

  if (!signedIn) {
    return <window.PreggKit.AuthScreen onSignIn={() => setSignedIn(true)} />;
  }

  const Screen = {
    dashboard: window.PreggKit.DashboardScreen,
    reminders: window.PreggKit.RemindersScreen,
    bp: window.PreggKit.BloodPressureScreen,
    weight: window.PreggKit.WeightScreen,
    baby: window.PreggKit.BabyScreen,
    settings: window.PreggKit.SettingsScreen,
  }[state.page];

  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100svh' }}>
      <div style={{ flex: 1, padding: '24px 16px 96px', maxWidth: 672, width: '100%', margin: '0 auto', boxSizing: 'border-box' }}>
        {state.page === 'dashboard' && <Screen state={state} onNavigate={(page) => setState((s) => ({ ...s, page }))} />}
        {state.page !== 'dashboard' && <Screen state={state} setState={setState} />}
      </div>
      <div style={{ position: 'fixed', bottom: 0, left: 0, right: 0, maxWidth: 420, margin: '0 auto' }}>
        <NavBar tabs={TABS} active={state.page} onChange={(page) => setState((s) => ({ ...s, page }))} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
